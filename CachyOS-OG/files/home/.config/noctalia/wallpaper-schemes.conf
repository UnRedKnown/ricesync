# ~/.config/noctalia/wallpaper-schemes.conf
# Which Material color scheme to use for which wallpaper.
# One rule per line: <pattern>  <scheme>  <glassbar scheme>  <active tab opacity>     (first match wins)
#
# pattern: file name, or a glob matched against the name or full path
# scheme:  m3-tonal-spot  m3-content  m3-fruit-salad  m3-rainbow  m3-monochrome
#          vibrant  faithful  dysfunctional  muted
# glassbar scheme: a, b, solid, rgba(r, g, b, a)
# a applies a slight hint to the glassbar, while b adds a darker overlay
# active tab opacity: 0-100 float or percentage (int), a higher value creates a darker tab

# Examples:
# */Wallpapers/anime/*   m3-rainbow  a       35      # a whole folder
# wallhaven-*            m3-content  solid   0.2     # by name prefix

wallhaven-x17mdz_1920x1080.png m3-tonal-spot a 0.4
wallhaven-x8wewl_1920x1080.png m3-content a 0.6
wallhaven-pomle9_1920x1080.png m3-tonal-spot b 0.2
wallhaven-0qdozr_1920x1080.png m3-tonal-spot a 0.8
wallhaven-2k8dex_1920x1080.png m3-tonal-spot a 0.3

# Default for everything else (delete this line to leave the scheme
# unchanged for wallpapers that match no rule)
*                m3-tonal-spot b 1
