font=Maple Mono:size=17
terminal=xdg-terminal-exec
prompt="> "
layer=overlay
lines=15
width=60
dpi-aware=no
inner-pad=10
horizontal-pad=40
vertical-pad=15
match-counter=yes
# colours: made by Noctalia from the wallpaper (~/.config/noctalia/templates/fuzzel.ini)
include=@HOME@/.config/fuzzel/themes/noctalia-custom

[border]
radius=10
width=2
