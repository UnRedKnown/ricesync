<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- apps that ask for "monospace" -->
  <alias>
    <family>monospace</family>
    <prefer><family>Maple Mono</family><family>Symbols Nerd Font</family></prefer>
  </alias>
  <!-- also as the normal UI font (sans-serif): delete this block to keep
       a proportional font for menus and text -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Maple Mono</family><family>Symbols Nerd Font</family></prefer>
  </alias>
  <alias><family>sans-serif</family><prefer><family>Maple Mono</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Maple Mono</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Maple Mono</family></prefer></alias>
</fontconfig>
