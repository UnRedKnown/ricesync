# ricesync / CachyOS-OG — package rules for collect.py
#
# Source is `pacman -Qqe` (explicitly installed). Each package gets the FIRST matching rule:
#
#   specific:<section> <regex>   goes to SPECIFIC/<section>/packages.txt (opt-in)
#   hard <regex>                 never installed (big/niche apps). Warned about if a kept config uses it.
#   olde <regex>                 old-desktop leftover. Dropped UNLESS a kept config/script calls
#                                one of its binaries — then it is kept (and reported).
#   add <name>                   always installed, even if not currently installed
#
# Regexes are Python, matched against the whole package name.
#
# Anything a kept config/script calls that is currently only installed as a dependency of
# a dropped package is added automatically, so nothing goes unsatisfied.

# --- always ------------------------------------------------------------------
add sunshine

# --- machine specific --------------------------------------------------------
specific:hardware nvidia.*|lib32-nvidia.*|opencl-nvidia|cuda.*|cudnn|nccl
specific:hardware rocm.*|hip-runtime.*|hipblas.*|miopen.*|rocblas.*|rccl|amdsmi
specific:hardware intel-oneapi.*|intel-lpmd|intel-compute-runtime|level-zero.*
specific:hardware input-remapper.*|logiops.*|keychron.*|solaar
specific:network  libvirt.*|qemu.*|virt-manager|virt-viewer|virt-install|dnsmasq|edk2-ovmf|swtpm|bridge-utils|vde2|spice-.*
specific:network  tailscale|samba|ufw|wol|gufw
specific:services backup.*

# --- big / niche apps (user: "omit things like DaVinci Resolve or Blender") ---
hard davinci-resolve.*|blender.*|godot.*|onlyoffice.*|unityhub.*|unity-editor.*
hard mote.*|thumby.*|beamng.*|modrinth.*|prismlauncher.*|pandora.*|minecraft.*
hard anydesk.*|warp-terminal.*|tenacity.*|ardour.*|lmms.*|krita.*|gimp.*|inkscape.*
hard pinta.*|photoflare.*|lazpaint.*|wivrn.*|envision.*|xrizer.*|monado.*|alvr.*
hard thunderbird.*|evolution.*|libreoffice.*|zoom|teams.*|discord.*|vesktop.*|vencord.*
hard spotify.*|spicetify.*|millennium.*|steam-millennium.*
hard wine.*|winetricks|bottles|lutris.*|heroic.*
hard visual-studio-code.*|code|vscodium.*|cursor.*|github-copilot.*|claude-code.*
hard chromium|google-chrome.*|microsoft-edge.*|epiphany

# --- leftovers of previous desktops --------------------------------------------
olde plasma.*|kde.*|kwin.*|kf6.*|kf5.*|qt5-.*kde.*|breeze.*|oxygen.*|sddm.*|plasma-login.*
olde dolphin.*|konsole|kate|kwrite|ark|gwenview|okular|spectacle|haruna|kcalc|kcharselect|partitionmanager|filelight|kdeconnect|kwalletmanager|ksystemlog|kinfocenter|systemsettings|discover|baloo.*|milou|krunner|powerdevil|bluedevil|plasma-nm|plasma-pa|xdg-desktop-portal-kde|polkit-kde-agent|kscreen.*|khotkeys|kmenuedit|knewstuff|klipper
olde cachyos-kde-settings|cachyos-hello|cachyos-plasma.*|cachyos-cosmic.*|cachyos-hyprland.*
olde cosmic.*|xdg-desktop-portal-cosmic
olde hyprland.*|hypr.*|xdg-desktop-portal-hyprland|aquamarine|waybar
olde dms.*|dank.*|caelestia.*|wayfire.*|wf-.*|driftwm.*|gnome-shell.*|gdm|mutter|nautilus|gnome-control-center|gnome-session|gnome-settings-daemon
olde alacritty|qt5ct|kvantum.*
