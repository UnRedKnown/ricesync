[global]
   workgroup = WORKGROUP
   server string = @REDACTED@
   log file = /var/log/samba/%m.log
   max log size = 50
   registry shares = yes
   
   # Security: Only listen to localhost and your VM network
   interfaces = 127.0.0.0/8 @IP@
   bind interfaces only = yes
   hosts allow = @REDACTED@

[OptimaShare]
   comment = Permanent Folder for Optima
   path = @HOME@/Documents/OptimaFiles
   browseable = yes
   writable = yes
   guest ok = no
   create mask = 0775
   directory mask = 0775
